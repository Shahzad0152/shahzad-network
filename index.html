<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SHAHZAD NETWORK</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* Pine gradient background */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #4e54c8, #8f94fb);
    color: #fff;
    text-align: center;
}
.container {
    padding: 60px 20px;
}
h1 {
    font-size: 50px;
    margin-top: 0;
}
p.subtitle {
    font-size: 20px;
    margin: 10px 0 30px;
}
.btn {
    background: #fff;
    color: #000;
    padding: 14px 30px;
    font-weight: bold;
    border-radius: 8px;
    text-decoration: none;
    display: inline-block;
    margin-top: 15px;
    transition: 0.3s;
}
.btn:hover {
    background: #e2e2e2;
}

/* Referral input section */
.ref-section {
    margin-top: 40px;
}
.ref-section input {
    width: 240px;
    padding: 12px;
    border: none;
    border-radius: 6px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
}
.ref-section button {
    cursor: pointer;
    background: #fff;
    color: #000;
    border: none;
    padding: 12px 24px;
    margin-top: 12px;
    font-weight: bold;
    border-radius: 6px;
}

/* How it works */
.features {
    text-align: left;
    max-width: 500px;
    margin: 50px auto;
}
.features h3 {
    font-size: 24px;
    margin-bottom: 8px;
}
.features ul {
    padding-left: 18px;
}
.features li {
    margin-bottom: 6px;
}
</style>
</head>
<body>

<div class="container">
    <h1>SHAHZAD NETWORK</h1>
    <p class="subtitle">Earn money online — Join and invite friends</p>

    <a href="#referral" class="btn">Join Now</a>

    <div class="features">
        <h3>How it works?</h3>
        <ul>
            <li>Invite others using your referral</li>
            <li>They join through your link</li>
            <li>You earn rewards</li>
        </ul>
    </div>

    <div class="ref-section" id="referral">
        <p>Your Referral Code</p>
        <input type="text" id="refInput" value="SHAHZAD-1891" readonly>
        <br>
        <button onclick="copyCode()">Copy Code</button>
    </div>

</div>

<script>
function copyCode() {
    const input = document.getElementById("refInput");
    input.select();
    input.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(input.value);
    alert("Copied: " + input.value);
}
</script>

</body>
</html>
